[package]
name = "parsebox-cli"
version = "0.3.0"
edition = "2021"
authors = ["Ada Lovelace <ada@example.com>"]
description = "Convert between data formats from the terminal"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = true
opt-level = 3
